# Copy to secret.yaml and change the values. secret.yaml is gitignored.
#   cp k8s/secret.example.yaml k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: maeilkanji-infra
  namespace: maeilkanji
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: change-me-root
  MYSQL_DATABASE: maeilkanji
  MYSQL_USER: maeilkanji
  MYSQL_PASSWORD: change-me
  REDIS_PASSWORD: change-me
  RABBITMQ_USERNAME: maeilkanji
  RABBITMQ_PASSWORD: change-me
