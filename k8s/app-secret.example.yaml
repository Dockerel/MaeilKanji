# App-only settings (mail, admin, public URL). Copy to app-secret.yaml and apply once:
#   cp k8s/app-secret.example.yaml k8s/app-secret.yaml
#   kubectl apply -f k8s/app-secret.yaml
# app-secret.yaml is gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: maeilkanji-app
  namespace: maeilkanji
type: Opaque
stringData:
  SMTP_HOST: smtp.resend.com
  SMTP_PORT: "587"
  SMTP_USERNAME: resend
  SMTP_PASSWORD: re_your_api_key
  MAIL_FROM: MaeilKanji <noreply@maeilkanji.com>
  ADMIN_EMAIL: admin@example.com
  SERVICE_BASE_URL: http://localhost:8080
  # 선택. 애드센스 승인 후 게시자 ID (메타 태그와 /ads.txt 에 쓰인다)
  ADSENSE_CLIENT_ID: ca-pub-0000000000000000
  # 선택. 소개·개인정보처리방침에 보일 문의 이메일. 비우면 피드백 페이지로 안내한다.
  CONTACT_EMAIL: contact@example.com
  # 선택. 있으면 매일 자정 학습 문제를 자동 생성한다.
  ANTHROPIC_API_KEY: sk-ant-your_api_key
  # 선택. 검색엔진 소유 확인 메타 태그의 content 값 (홈 페이지 <head> 에 들어간다)
  NAVER_SITE_VERIFICATION: your_naver_verification_code
  GOOGLE_SITE_VERIFICATION: your_google_verification_code
  # 선택. 다음 웹마스터도구 소유 확인 값 (robots.txt 첫 줄에 들어간다)
  DAUM_SITE_VERIFICATION: "#DaumWebMasterTool:your_daum_code"
