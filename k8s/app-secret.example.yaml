# App-only settings (mail, admin, public URL). Copy to app-secret.yaml and apply once:
#   cp k8s/app-secret.example.yaml k8s/app-secret.yaml
#   kubectl apply -f k8s/app-secret.yaml
# app-secret.yaml is gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: maeilkanji-app
  namespace: maeilkanji
type: Opaque
stringData:
  SMTP_HOST: smtp.resend.com
  SMTP_PORT: "587"
  SMTP_USERNAME: resend
  SMTP_PASSWORD: re_your_api_key
  MAIL_FROM: MaeilKanji <noreply@maeilkanji.com>
  ADMIN_EMAIL: admin@example.com
  SERVICE_BASE_URL: http://localhost:8080
  # 선택. 있으면 매일 자정 학습 문제를 자동 생성한다.
  ANTHROPIC_API_KEY: sk-ant-your_api_key
