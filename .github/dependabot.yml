# App-side patching: Dependabot opens PRs, CI tests them, dependabot-auto-merge.yml merges
# green ones, CD deploys. Majors are ignored everywhere so auto-merge only sees patch/minor;
# majors (and Kotlin 2 / Kotest 6 / Boot 4) come through security-patch.yml for a human to merge.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: Asia/Seoul }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      patches:
        update-types: [patch]
  - package-ecosystem: docker
    directories: [/, /docker/mysql]
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
