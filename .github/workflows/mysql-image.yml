name: mysql image

# Builds docker/mysql (mysql:8.4 minus mysql-shell, gosu rebuilt with a current Go).
# Pushed as a tag of the existing public package, so k3s can pull it without a pull secret.
# Weekly rebuild picks up new upstream 8.4 builds; security-guard decides whether to roll it out.
on:
  push:
    branches: [main]
    paths:
      - 'docker/mysql/**'
      - '.github/workflows/mysql-image.yml'
  schedule:
    - cron: '0 18 * * 0'   # Monday 03:00 KST, before the 04:30 security-guard run
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mysql-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dockerel/maeilkanji

jobs:
  build:
    # Native arm64 runner: the k3s node is a Raspberry Pi (arm64).
    runs-on: ubuntu-24.04-arm
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: build and push image
        uses: docker/build-push-action@v6
        with:
          context: docker/mysql
          platforms: linux/arm64
          pull: true
          no-cache: true
          push: true
          tags: ${{ env.IMAGE }}:mysql-8.4
