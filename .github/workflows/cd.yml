name: cd pipeline

# Runs after "ci pipeline" passes on a push to main.
on:
  workflow_run:
    workflows: ["ci pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dockerel/maeilkanji

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    # Native arm64 runner: the k3s node is a Raspberry Pi (arm64).
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: set image tag
        id: meta
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: set up jdk 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: set up gradle
        uses: gradle/actions/setup-gradle@v3

      - name: build jar
        run: |
          chmod +x gradlew
          ./gradlew bootJar
          cp "$(ls build/libs/*.jar | grep -v -- '-plain.jar' | head -1)" app.jar

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build
    # Self-hosted runner on the Raspberry Pi. Its kubeconfig reaches the k3s API.
    runs-on: [self-hosted, linux, ARM64, k3s]
    environment: production

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: apply manifest
        run: |
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}:${{ needs.build.outputs.tag }}|" k8s/app.yaml \
            | kubectl apply -f -

      - name: wait for rollout
        run: kubectl -n maeilkanji rollout status deployment/maeilkanji --timeout=300s

      - name: show logs on failure
        if: failure()
        run: |
          kubectl -n maeilkanji get pods -l app=maeilkanji -o wide || true
          kubectl -n maeilkanji describe deployment/maeilkanji | tail -30 || true
          kubectl -n maeilkanji logs deployment/maeilkanji --tail=100 || true
