services:
  mysql:
    image: mysql:8.0
    container_name: maeilkanji-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: maeilkanji
      MYSQL_USER: maeilkanji
      MYSQL_PASSWORD: maeilkanji
    ports:
      - "3306:3306"
    volumes:
      - maeilkanji-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "maeilkanji", "-pmaeilkanji"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: maeilkanji-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: maeilkanji-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: maeilkanji-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  maeilkanji-mysql-data:
