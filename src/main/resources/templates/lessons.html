<!DOCTYPE html>
<!-- /lessons (전체) 와 /lessons/{level} (레벨 하나) 공용. 매일 자동 생성되는 학습도 DB 에서 바로 보인다. -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/page :: seoHead(
        ${currentLevel == null} ? '일본어 한자 학습 전체 목록 (초급·중급·고급)' : ${currentLevel.korean} + ' 일본어 한자 학습 목록',
        ${currentLevel == null}
            ? 'JLPT N5~N1 수준 일본어 한자를 반의 관계 한자 쌍으로 묶어 정리했습니다. 레벨별 학습마다 읽기, 핵심 단어 4개, 후리가나 예문, 퀴즈가 있습니다.'
            : ${currentLevel.korean} + ' 일본어 한자 학습 전체 목록. 한자 쌍마다 음독·훈독, 핵심 단어 4개, 후리가나 예문, 4지선다 퀴즈를 무료로 볼 수 있습니다.',
        ${currentLevel == null} ? '/lessons' : '/lessons/' + ${currentLevel.path})}"></head>
<body>
<nav th:replace="~{fragments/page :: nav}"></nav>

<main class="page-main">
    <div class="container px-4">
        <div class="text-center mb-5">
            <p class="section-label">Kanji Library</p>
            <h1 class="section-title h2"
                th:text="${currentLevel == null} ? '일본어 한자 학습 목록' : ${currentLevel.korean} + ' 일본어 한자 학습 목록'">일본어 한자 학습 목록</h1>
            <p class="text-muted-2 mt-2 mb-0">
                반대 뜻을 가진 한자 두 개를 함께 익히는 매일 칸지의 학습을 모두 모았습니다.<br class="d-none d-md-inline">
                학습을 누르면 읽기, 단어, 예문, 퀴즈를 볼 수 있어요.
            </p>
            <div class="d-flex flex-wrap gap-2 justify-content-center mt-4">
                <a th:href="@{/lessons}" class="btn btn-sm"
                   th:classappend="${currentLevel == null} ? 'btn-maeil' : 'btn-ghost'">전체</a>
                <a th:each="lv : ${T(maeilkanji.maeilkanji.business.domain.KanjiLevel).values()}"
                   th:href="@{/lessons/{p}(p=${lv.path})}" class="btn btn-sm"
                   th:classappend="${currentLevel == lv} ? 'btn-maeil' : 'btn-ghost'"
                   th:text="${lv.korean}">초급</a>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-9">
                <section th:each="section : ${sections}" class="page-card mb-4">
                    <div class="page-card-body">
                        <h2 class="h5 fw-bold mb-1">
                            <span th:text="${section.level.korean}">초급</span>
                            <span class="small text-muted-2 fw-normal"
                                  th:text="${section.level.name() == 'BEGINNER'} ? 'JLPT N5~N4' : (${section.level.name() == 'INTERMEDIATE'} ? 'JLPT N3~N2' : 'JLPT N1')">JLPT N5~N4</span>
                        </h2>
                        <p class="small text-muted-2 mb-3" th:text="${#lists.size(section.lessons)} + '개 학습'">110개 학습</p>
                        <ol class="lesson-list list-unstyled mb-0">
                            <li th:each="lesson : ${section.lessons}">
                                <a th:href="@{/daily-content/{p}/{id}(p=${section.level.path},id=${lesson.id})}">
                                    <span class="lesson-no" th:text="'#' + ${lesson.id}">#1</span>
                                    <span class="jp fw-bold" lang="ja" th:text="${lesson.kanji1} + ' · ' + ${lesson.kanji2}">上 · 下</span>
                                    <span class="small text-muted-2" th:text="${lesson.meaning1} + ' / ' + ${lesson.meaning2}">위 / 아래</span>
                                </a>
                            </li>
                        </ol>
                    </div>
                </section>

                <div class="info-box text-center">
                    매일 아침 새 한자 학습을 메일로 받아보세요. <a href="/#cta" class="fw-semibold">무료 구독하기</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/page :: footer}"></footer>
</body>
</html>
