<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/page :: head('구독 해지')}"></head>
<body>
<nav th:replace="~{fragments/page :: nav}"></nav>

<main class="page-main">
    <div class="container px-4">
        <div class="text-center mb-5">
            <p class="section-label">Unsubscribe</p>
            <h1 class="section-title h2">매일 칸지 구독을 해지하시겠어요?</h1>
            <p class="text-muted-2 mt-2 mb-0">해지하면 매일 아침 학습 메일을 더 이상 받아볼 수 없어요.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="page-card">
                    <div class="page-card-body">
                        <p class="block-title">구독을 유지하면</p>
                        <ul class="check-list mb-4">
                            <li>매일 아침 한자 2개와 핵심 단어·예문을 받아볼 수 있어요</li>
                            <li>미니 퀴즈로 3분 만에 오늘의 학습을 마무리해요</li>
<!--                            <li>학습 기록 동기화 및 진행도 통계</li>-->
<!--                            <li>레벨별 맞춤 예문과 복습 리마인드</li>-->
                        </ul>

                        <div class="info-box">
                            <p class="fw-bold mb-1">난이도가 맞지 않으셨나요?</p>
                            <p class="small text-muted-2 mb-2">해지 대신 레벨을 바꿔서 나에게 맞는 한자를 받아볼 수 있어요.</p>
                            <a th:href="@{/change-level-confirm(memberId=${memberId})}" class="small fw-bold text-maeil text-decoration-none">
                                레벨 변경하러 가기 →
                            </a>
                        </div>
                    </div>

                    <div class="page-card-foot d-flex flex-column flex-sm-row gap-2 justify-content-end">
                        <a th:href="@{/}" class="btn btn-ghost">계속 구독할게요</a>
                        <a th:href="@{${baseUrl}/unsubscribe(memberId=${memberId})}" class="btn btn-danger-soft">구독 해지하기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/page :: footer}"></footer>
</body>
</html>
