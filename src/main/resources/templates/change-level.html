<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/page :: head('레벨 변경')}"></head>
<body>
<nav th:replace="~{fragments/page :: nav}"></nav>

<main class="page-main">
    <div class="container px-4">
        <div class="text-center mb-5">
            <p class="section-label">Change Level</p>
            <h1 class="section-title h2">학습 레벨을 변경하시겠어요?</h1>
            <p class="text-muted-2 mt-2 mb-0">난이도는 언제든 바꿀 수 있어요. 다음 메일부터 새 레벨의 한자를 받게 됩니다.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <form class="page-card" th:action="@{/change-level}" method="post">
                    <input type="hidden" name="memberId" th:value="${memberId}">

                    <div class="page-card-body">
                        <p class="block-title">레벨 선택</p>
                        <div class="choice-grid">
                            <label class="choice-card">
                                <input type="radio" name="newLevel" value="BEGINNER"
                                       th:checked="${memberLevel == 'BEGINNER'}" required>
                                <span class="choice-title">초급</span>
                                <span class="choice-desc">한자의 기초부터 시작, 쉬운 예문과 단어 제공</span>
                            </label>
                            <label class="choice-card">
                                <input type="radio" name="newLevel" value="INTERMEDIATE"
                                       th:checked="${memberLevel == 'INTERMEDIATE'}">
                                <span class="choice-title">중급</span>
                                <span class="choice-desc">일상생활에서 자주 쓰이는 한자 중심</span>
                            </label>
                            <label class="choice-card">
                                <input type="radio" name="newLevel" value="ADVANCED"
                                       th:checked="${memberLevel == 'ADVANCED'}">
                                <span class="choice-title">고급</span>
                                <span class="choice-desc">뉴스·문학·공부에 자주 등장하는 고난도 한자 포함</span>
                            </label>
                        </div>
                    </div>

                    <div class="page-card-foot d-flex flex-column flex-sm-row gap-2 justify-content-end">
                        <a th:href="@{/}" class="btn btn-ghost">취소</a>
                        <button type="submit" class="btn btn-maeil" id="submitBtn" disabled>변경하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/page :: footer}"></footer>

<script>
    // 레벨을 고르기 전에는 변경하기 버튼을 비활성화한다.
    (function () {
        const submitBtn = document.getElementById('submitBtn');
        const radios = document.querySelectorAll('input[name="newLevel"]');
        const sync = () => { submitBtn.disabled = ![...radios].some(r => r.checked); };
        radios.forEach(r => r.addEventListener('change', sync));
        sync();
    })();
</script>
</body>
</html>
