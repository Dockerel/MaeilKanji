<!DOCTYPE html>
<!--
  퀴즈 결과 페이지. 메일/학습 페이지의 객관식 보기를 누르면 들어온다. (?choice=0~3[&memberId=...])
  채점은 서버에서 렌더링하고, 응답 기록·정답률·스트릭은 JS 가 POST 로 처리한다.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/page :: head('퀴즈 결과')}"></head>
<body>
<nav th:replace="~{fragments/page :: nav}"></nav>

<style>
    .result-hero {
        text-align: center;
        padding: 8px 0 4px;
    }

    .result-emoji {
        display: inline-block;
        font-size: 3.5rem;
        line-height: 1;
        animation: result-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .result-title {
        font-weight: 900;
        letter-spacing: -0.02em;
        animation: result-fade-up 0.5s 0.15s ease-out both;
    }

    .result-title.correct {
        color: var(--maeil-green);
    }

    .result-title.wrong {
        color: var(--maeil-danger);
    }

    .choice-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .choice-list li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border: 1px solid var(--maeil-line);
        border-radius: 10px;
        margin-bottom: 8px;
        background-color: white;
        animation: result-fade-up 0.4s ease-out both;
    }

    .choice-list li:nth-child(2) { animation-delay: 0.05s; }
    .choice-list li:nth-child(3) { animation-delay: 0.1s; }
    .choice-list li:nth-child(4) { animation-delay: 0.15s; }

    .choice-list li.is-answer {
        border-color: var(--maeil-green);
        background-color: #F0FDF4;
        font-weight: 700;
    }

    .choice-list li.is-picked-wrong {
        border-color: var(--maeil-danger);
        background-color: #FEF2F2;
        text-decoration: line-through;
        color: var(--maeil-muted);
    }

    .choice-no {
        flex-shrink: 0;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background-color: var(--maeil-light-blue);
        color: var(--maeil-blue);
        font-size: 0.85rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .choice-mark {
        margin-left: auto;
        font-size: 0.85rem;
        white-space: nowrap;
    }

    .stats-box {
        border-radius: 12px;
        background-color: var(--maeil-light-blue);
        padding: 16px 18px;
        animation: result-fade-up 0.4s ease-out both;
    }

    .stats-bar {
        height: 10px;
        border-radius: 999px;
        background-color: white;
        overflow: hidden;
        margin: 10px 0 6px;
    }

    .stats-bar-fill {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background-color: var(--maeil-blue);
        transition: width 0.8s ease-out;
    }

    .streak-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: 999px;
        background-color: #FFF7ED;
        color: #C2410C;
        font-weight: 700;
        font-size: 0.9rem;
        animation: result-fade-up 0.4s ease-out both;
    }

    [hidden] {
        display: none !important;
    }

    @keyframes result-pop {
        from { opacity: 0; transform: scale(0.4); }
        to { opacity: 1; transform: none; }
    }

    @keyframes result-fade-up {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
        .result-emoji, .result-title, .choice-list li, .stats-box, .streak-badge {
            animation: none;
        }

        .stats-bar-fill {
            transition: none;
        }
    }
</style>

<main class="page-main">
    <div class="container px-4">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="page-card">
                    <div class="page-card-body">
                        <div class="result-hero mb-4">
                            <span class="result-emoji" aria-hidden="true" th:text="${correct} ? '🎉' : '💪'">🎉</span>
                            <p class="section-label mt-3 mb-1" th:text="${levelLabel} + ' · 오늘의 퀴즈'">초급 · 오늘의 퀴즈</p>
                            <h1 class="result-title h3 mb-2" th:classappend="${correct} ? 'correct' : 'wrong'"
                                th:text="${correct} ? '정답입니다!' : '아쉬워요, 오답이에요'">정답입니다!</h1>
                            <p id="streak-badge" class="streak-badge mt-2 mb-0" hidden>
                                🔥 <span><span id="streak-count">1</span>일 연속 학습 중</span>
                            </p>
                        </div>

                        <p class="fw-bold mb-3" th:text="'Q. ' + ${content.quiz}">Q. '대학교'를 일본어로 무엇이라고 할까요?</p>

                        <ul class="choice-list mb-4">
                            <li th:each="c, st : ${quiz.choices}"
                                th:classappend="${st.index == quiz.answerIndex} ? 'is-answer' : (${st.index == choice} ? 'is-picked-wrong' : '')">
                                <span class="choice-no" th:text="${st.count}">1</span>
                                <span class="jp ja-term" lang="ja" th:text="${c}">だいがく (大学)</span>
                                <span class="choice-mark text-success" th:if="${st.index == quiz.answerIndex}">✔ 정답</span>
                                <span class="choice-mark text-danger" th:if="${st.index == choice and st.index != quiz.answerIndex}">내 선택</span>
                            </li>
                        </ul>

                        <div class="sentence-box mb-4">
                            <p class="small mb-0" th:text="${content.explanation}">'대학교'는 일본어로 大学(だいがく)이라고 읽습니다.</p>
                        </div>

                        <div id="stats-box" class="stats-box mb-2" hidden>
                            <p class="fw-bold mb-0" id="stats-title">오늘 12명 중 63%가 맞혔어요</p>
                            <div class="stats-bar" role="presentation">
                                <div class="stats-bar-fill" id="stats-bar-fill"></div>
                            </div>
                            <p class="small text-muted-2 mb-0" id="stats-message"></p>
                        </div>
                    </div>

                    <div class="page-card-foot d-flex flex-wrap gap-2 justify-content-center">
                        <a th:href="@{/daily-content/{lp}/{id}(lp=${levelPath},id=${content.id})}" class="btn btn-maeil" id="lesson-link">
                            📖 오늘의 학습 전체 보기
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/page :: footer}"></footer>

<script th:inline="javascript">
    (function () {
        var level = /*[[${content.level.name()}]]*/ 'BEGINNER';
        var contentId = /*[[${content.id}]]*/ 1;
        var choice = /*[[${choice}]]*/ 0;
        var correct = /*[[${correct}]]*/ true;

        var params = new URLSearchParams(window.location.search);
        var memberId = params.get('memberId');

        // 주소를 공유해도 다른 사람 응답이 내 기록으로 남지 않도록 memberId 를 주소창에서 지운다.
        if (memberId) {
            params.delete('memberId');
            window.history.replaceState(null, '', window.location.pathname + '?' + params.toString() + window.location.hash);
            var lessonLink = document.getElementById('lesson-link');
            lessonLink.href = lessonLink.getAttribute('href') + '?memberId=' + encodeURIComponent(memberId);
        }

        function postJson(url, body) {
            return fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            }).then(function (res) { return res.ok ? res.json() : null; });
        }

        function statsMessage(rate) {
            if (correct) {
                if (rate <= 30) return '맞힌 사람이 많지 않은 어려운 문제였어요. 상위 ' + rate + '% 안에 들었어요! 👏';
                if (rate <= 50) return '절반도 못 맞힌 문제를 맞혔어요. 상위 그룹이에요! 👍';
                return '대부분이 맞힌 문제예요. 내일도 이 기세로!';
            }
            if (rate <= 50) return '많은 분이 헷갈린 문제예요. 해설을 한 번 더 읽어보세요.';
            return '괜찮아요! 틀린 문제가 가장 오래 기억에 남아요.';
        }

        postJson('/api/v1/quiz/answers', {level: level, contentId: contentId, choice: choice, memberId: memberId})
            .then(function (data) {
                if (!data || data.correctRate === null || data.totalCount === 0) return;
                document.getElementById('stats-title').textContent =
                    '오늘 ' + data.totalCount + '명 중 ' + data.correctRate + '%가 맞혔어요';
                document.getElementById('stats-message').textContent = statsMessage(data.correctRate);
                document.getElementById('stats-box').hidden = false;
                requestAnimationFrame(function () {
                    document.getElementById('stats-bar-fill').style.width = data.correctRate + '%';
                });
            })
            .catch(function () { /* 정답률 조회 실패는 결과 표시에 영향 없음 */ });

        if (memberId) {
            postJson('/api/v1/members/streak', {memberId: memberId})
                .then(function (data) {
                    if (!data || !data.streak) return;
                    document.getElementById('streak-count').textContent = data.streak;
                    document.getElementById('streak-badge').hidden = false;
                })
                .catch(function () { /* 스트릭 기록 실패는 결과 표시에 영향 없음 */ });
        }
    })();
</script>
</body>
</html>
