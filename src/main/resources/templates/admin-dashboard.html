<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매일 칸지 Admin 대시보드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --maeil-blue: #2563EB;
            --maeil-light-blue: #F0F5FF;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif !important;
            background-color: var(--maeil-light-blue);
        }
        .text-maeil { color: var(--maeil-blue) !important; }
        .bg-maeil { background-color: var(--maeil-blue) !important; }
        .btn-maeil {
            background-color: var(--maeil-blue);
            border-color: var(--maeil-blue);
            color: white;
            transition: all 0.3s;
        }
        .btn-maeil:hover {
            background-color: #1E4DBC;
            border-color: #1E4DBC;
            color: white;
        }
        .card-maeil {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        .form-label { font-weight: 700; font-size: 0.85rem; }
        .content-table th { font-weight: 700; }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-maeil mb-1"><i class="fas fa-server me-2"></i>관리자 대시보드</h3>
            <p class="text-muted mb-0">데일리 학습 내용 관리</p>
        </div>
        <div>
            <button class="btn btn-outline-maeil btn-sm" onclick="logout()">
                <i class="fas fa-sign-out-alt me-1"></i>로그아웃
            </button>
        </div>
    </div>

    <!-- 레벨별 콘텐츠 추가 섹션 -->
    <div class="row g-4">
        <div class="col-lg-4" th:each="level : ${levels}">
            <div class="card card-maeil p-3 h-100">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">
                        <i class="fas fa-book-open me-2 text-maeil"></i>
                        [[${level.korean}]]
                    </h5>
                    <span class="badge bg-maeil text-white">레벨 [[${level.enumValue}]]</span>
                </div>

                <form id="contentForm-[[${level.level}]]" class="content-form" data-level="[[${level.level}]]">
                    <div class="mb-2">
                        <label class="form-label">한자 1</label>
                        <input type="text" class="form-control" name="kanji1" placeholder="예: 日" required>
                    </div>
                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <label class="form-label">読み方 1</label>
                            <input type="text" class="form-control" name="yomi1" placeholder="예시: にち" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">뜻 1</label>
                            <input type="text" class="form-control" name="meaning1" placeholder="예: 하루, 날" required>
                        </div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">한자 2</label>
                        <input type="text" class="form-control" name="kanji2" placeholder="예: 本" required>
                    </div>
                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <label class="form-label">読み方 2</label>
                            <input type="text" class="form-control" name="yomi2" placeholder="예시: ほん" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">뜻 2</label>
                            <input type="text" class="form-control" name="meaning2" placeholder="예: 근본, 책" required>
                        </div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label small fw-bold">단어 (4개)</label>
                        <div class="row g-2">
                            <div class="col-6">
                                <input type="text" class="form-control" name="word1" placeholder="단어1" required>
                                <input type="text" class="form-control mt-1" name="wordMeaning1" placeholder="뜻" required>
                            </div>
                            <div class="col-6">
                                <input type="text" class="form-control" name="word2" placeholder="단어2" required>
                                <input type="text" class="form-control mt-1" name="wordMeaning2" placeholder="뜻" required>
                            </div>
                            <div class="col-6">
                                <input type="text" class="form-control" name="word3" placeholder="단어3" required>
                                <input type="text" class="form-control mt-1" name="wordMeaning3" placeholder="뜻" required>
                            </div>
                            <div class="col-6">
                                <input type="text" class="form-control" name="word4" placeholder="단어4" required>
                                <input type="text" class="form-control mt-1" name="wordMeaning4" placeholder="뜻" required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label small fw-bold">예문</label>
                        <input type="text" class="form-control" name="sentence" placeholder="예문" required>
                        <input type="text" class="form-control mt-1" name="sentenceMeaning" placeholder="예문 뜻" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small fw-bold">퀴즈</label>
                        <input type="text" class="form-control" name="quiz" placeholder="퀴즈 질문" required>
                        <input type="text" class="form-control mt-1" name="answer" placeholder="정답" required>
                        <input type="text" class="form-control mt-1" name="explanation" placeholder="설명" required>
                    </div>

                    <button type="submit" class="btn btn-maeil w-100">
                        <i class="fas fa-save me-1"></i> 저장
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const ADMIN_API_URL = '/api/v1/admin';

    document.querySelectorAll('.content-form').forEach(form => {
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = form.querySelector('button[type="submit"]');
            const level = form.dataset.level;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> 저장 중...';

            const formData = new FormData(form);
            const payload = {};
            for (const [key, value] of formData.entries()) {
                payload[key] = value;
            }
            payload.level = level;

            try {
                const response = await fetch(`${ADMIN_API_URL}/content`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    alert(`✅ ${level} 콘텐츠 저장 완료 (ID: ${data.id})`);
                    form.reset();
                } else {
                    const errorText = await response.text();
                    alert(`❌ 저장 실패: ${errorText}`);
                }
            } catch (error) {
                alert('❌ 서버 통신 오류');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save me-1"></i> 저장';
            }
        });
    });

    // 로그아웃: 단순 페이지 이동 (세션 쿠키 만료 기반)
    function logout() {
        window.location.href = '/admin/login';
    }
</script>
</body>
</html>
