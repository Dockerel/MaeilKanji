<!DOCTYPE html>
<!--
  프로필 꾸미기 (/me/edit). 저장은 PUT /api/v1/profile/me (ProfileRestController).
  아바타·테마는 최장 스트릭으로 잠금이 풀리고, 대표 배지는 얻은 배지 중에서 고른다.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/page :: head('프로필 꾸미기')}"></head>
<body>
<nav th:replace="~{fragments/page :: nav}"></nav>
<link rel="stylesheet" href="/css/profile.css">

<main class="page-main" style="padding-top: 32px;">
    <div class="container px-3">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <p class="section-label">PROFILE</p>
                <h1 class="section-title h3 mb-3">프로필 꾸미기</h1>

                <!-- 미리보기 -->
                <section class="page-card mb-3" aria-label="미리보기">
                    <div class="profile-banner" id="preview-banner" th:classappend="'theme-' + ${profile.theme.cssName}" style="height: 120px;"></div>
                    <div class="profile-head">
                        <span class="kavatar size-xl" id="preview-avatar" th:classappend="'av-' + ${profile.avatar.cssName}"
                              th:text="${profile.avatar.glyph}" aria-hidden="true">笑</span>
                        <p class="profile-name mb-0">
                            <span id="preview-name" th:text="${profile.displayName}">익명의 학습자</span>
                            <span class="bchip featured-badge" id="preview-badge" th:hidden="${profile.featuredBadge == null}"
                                  th:classappend="${profile.featuredBadge != null ? 'cat-' + profile.featuredBadge.category.cssName : ''}"><i
                                    th:class="${profile.featuredBadge != null ? 'fa-solid fa-' + profile.featuredBadge.icon : ''}"></i><span
                                    th:text="${profile.featuredBadge != null ? profile.featuredBadge.title : ''}"></span></span>
                        </p>
                        <p class="profile-bio" id="preview-bio" th:text="${profile.bio}"></p>
                    </div>
                </section>

                <form id="profile-form" class="page-card" novalidate>
                    <div class="page-card-body">
                        <!-- 닉네임 -->
                        <div class="mb-4">
                            <label for="nickname" class="block-title d-block">닉네임</label>
                            <input type="text" id="nickname" name="nickname" class="form-control form-control-lg"
                                   th:value="${profile.nickname}" th:maxlength="${nicknameMaxLength}"
                                   placeholder="예: 칸지왕" autocomplete="off" aria-describedby="nickname-hint">
                            <p id="nickname-hint" class="form-hint mt-1 mb-0">2~12자 한글·영문·숫자·밑줄(_). 비워 두면 랭킹에 '익명의 학습자'로 표시돼요.</p>
                        </div>

                        <!-- 소개 -->
                        <div class="mb-4">
                            <label for="bio" class="block-title d-block">한 줄 소개</label>
                            <textarea id="bio" name="bio" class="form-control" rows="2" maxlength="100"
                                      placeholder="예: JLPT N2 목표! 매일 아침 한자 두 개" th:text="${profile.bio}"></textarea>
                            <p class="form-hint mt-1 mb-0 text-end"><span id="bio-count">0</span> / 100</p>
                        </div>

                        <!-- 아바타 -->
                        <fieldset class="mb-4">
                            <legend class="block-title">아바타</legend>
                            <div class="pick-grid">
                                <label class="pick" th:each="a : ${avatars}"
                                       th:title="${a.isUnlocked(profile.maxStreak) ? '' : '최장 스트릭 ' + a.requiredMaxStreak + '일 달성 시 열림'}">
                                    <input type="radio" name="avatar" th:value="${a.name()}" th:data-glyph="${a.glyph}" th:data-css="${a.cssName}" th:checked="${a == profile.avatar}" th:disabled="${!a.isUnlocked(profile.maxStreak)}">
                                    <span class="pick-face">
                                        <span class="kavatar size-md" th:classappend="'av-' + ${a.cssName}" th:text="${a.glyph}">笑</span>
                                        <small th:if="${a.isUnlocked(profile.maxStreak)}" th:text="${a.label}">웃음</small>
                                        <small class="lock" th:unless="${a.isUnlocked(profile.maxStreak)}"><i class="fa-solid fa-lock"></i><span th:text="${a.requiredMaxStreak} + '일'">3일</span></small>
                                    </span>
                                </label>
                            </div>
                        </fieldset>

                        <!-- 테마 -->
                        <fieldset class="mb-4">
                            <legend class="block-title">배경 테마</legend>
                            <div class="pick-grid wide">
                                <label class="pick" th:each="t : ${themes}">
                                    <input type="radio" name="theme" th:value="${t.name()}" th:data-css="${t.cssName}"
                                           th:checked="${t == profile.theme}" th:disabled="${!t.isUnlocked(profile.maxStreak)}">
                                    <span class="pick-face">
                                        <span class="pick-swatch" th:classappend="'theme-' + ${t.cssName}"></span>
                                        <small th:if="${t.isUnlocked(profile.maxStreak)}" th:text="${t.label}">기본 블루</small>
                                        <small class="lock" th:unless="${t.isUnlocked(profile.maxStreak)}"><i class="fa-solid fa-lock"></i><span th:text="${t.label} + ' · ' + ${t.requiredMaxStreak} + '일'">벚꽃 · 3일</span></small>
                                    </span>
                                </label>
                            </div>
                            <p class="form-hint mt-2 mb-0">
                                <i class="fa-solid fa-fire text-warning-emphasis"></i> 최장 스트릭이 늘수록 새 아바타와 테마가 열려요. 지금 최장 스트릭: <strong th:text="${profile.maxStreak} + '일'">0일</strong>
                            </p>
                        </fieldset>

                        <!-- 대표 배지 -->
                        <fieldset class="mb-2">
                            <legend class="block-title">대표 배지</legend>
                            <div class="pick-grid wide">
                                <label class="pick">
                                    <input type="radio" name="featuredBadge" value="" th:checked="${profile.featuredBadge == null}">
                                    <span class="pick-face"><span class="medal size-sm locked" style="--cat-soft: #F1F5F9"><i class="fa-solid fa-ban"></i></span><small>표시 안 함</small></span>
                                </label>
                                <label class="pick" th:each="b : ${earnedBadges}" th:title="${b.description}">
                                    <input type="radio" name="featuredBadge" th:value="${b.name()}" th:data-title="${b.title}"
                                           th:data-icon="${b.icon}" th:data-cat="${b.category.cssName}"
                                           th:checked="${b == profile.featuredBadge}">
                                    <span class="pick-face"><span class="medal size-sm" th:classappend="'cat-' + ${b.category.cssName}"><i th:class="'fa-solid fa-' + ${b.icon}"></i></span><small th:text="${b.title}">새싹</small></span>
                                </label>
                            </div>
                            <p class="form-hint mt-2 mb-0" th:if="${#lists.isEmpty(earnedBadges)}">
                                아직 얻은 배지가 없어요. 3일 연속 학습하거나 퀴즈를 풀면 첫 배지를 얻어요!
                            </p>
                        </fieldset>
                    </div>
                    <div class="page-card-foot d-flex gap-2 justify-content-end">
                        <a th:href="@{/me}" class="btn btn-ghost">취소</a>
                        <button type="submit" class="btn btn-maeil" id="save-btn">저장하기</button>
                    </div>
                    <p class="text-danger small px-4 pb-3 mb-0" id="form-error" role="alert" hidden></p>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/page :: footer}"></footer>

<script th:inline="javascript">
    (function () {
        var anonymousName = /*[[${anonymousName}]]*/ '익명의 학습자';
        var form = document.getElementById('profile-form');
        var nickname = document.getElementById('nickname');
        var hint = document.getElementById('nickname-hint');
        var bio = document.getElementById('bio');
        var bioCount = document.getElementById('bio-count');
        var error = document.getElementById('form-error');
        var saveBtn = document.getElementById('save-btn');
        var defaultHint = hint.textContent;
        var nicknameOk = true;
        var checkTimer = null;

        function checked(name) {
            return form.querySelector('input[name="' + name + '"]:checked');
        }

        function updatePreview() {
            document.getElementById('preview-name').textContent = nickname.value.trim() || anonymousName;
            document.getElementById('preview-bio').textContent = bio.value.trim();
            bioCount.textContent = bio.value.length;
            var avatar = checked('avatar');
            if (avatar) {
                var avatarEl = document.getElementById('preview-avatar');
                avatarEl.textContent = avatar.dataset.glyph;
                avatarEl.className = 'kavatar size-xl av-' + avatar.dataset.css;
            }
            var theme = checked('theme');
            if (theme) document.getElementById('preview-banner').className = 'profile-banner theme-' + theme.dataset.css;
            var badge = checked('featuredBadge');
            var badgeEl = document.getElementById('preview-badge');
            var hasBadge = !!(badge && badge.value);
            badgeEl.hidden = !hasBadge;
            if (hasBadge) {
                badgeEl.className = 'bchip featured-badge cat-' + badge.dataset.cat;
                badgeEl.querySelector('i').className = 'fa-solid fa-' + badge.dataset.icon;
                badgeEl.querySelector('span').textContent = badge.dataset.title;
            }
        }

        function setHint(text, state) {
            hint.textContent = text;
            hint.className = 'form-hint mt-1 mb-0' + (state ? ' ' + state : '');
        }

        nickname.addEventListener('input', function () {
            updatePreview();
            clearTimeout(checkTimer);
            var value = nickname.value.trim();
            if (!value) {
                nicknameOk = true;
                setHint(defaultHint, '');
                return;
            }
            nicknameOk = false;
            checkTimer = setTimeout(function () {
                fetch('/api/v1/profile/nickname-check?nickname=' + encodeURIComponent(value))
                    .then(function (res) { return res.ok ? res.json() : null; })
                    .then(function (data) {
                        if (!data || nickname.value.trim() !== value) return;
                        nicknameOk = data.available;
                        setHint(data.message, data.available ? 'ok' : 'bad');
                    })
                    .catch(function () { nicknameOk = true; /* 저장 때 서버가 다시 확인한다 */ });
            }, 300);
        });

        bio.addEventListener('input', updatePreview);
        form.addEventListener('change', updatePreview);
        updatePreview();

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            error.hidden = true;
            if (!nicknameOk) {
                nickname.focus();
                return;
            }
            var avatar = checked('avatar');
            var theme = checked('theme');
            var badge = checked('featuredBadge');
            saveBtn.disabled = true;
            fetch('/api/v1/profile/me', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    nickname: nickname.value.trim() || null,
                    bio: bio.value.trim() || null,
                    avatar: avatar ? avatar.value : null,
                    theme: theme ? theme.value : null,
                    featuredBadge: badge && badge.value ? badge.value : null
                })
            }).then(function (res) {
                if (res.ok) return res.json().then(function (data) { window.location.href = data.profileUrl; });
                return res.text().then(function (message) {
                    error.textContent = message || '저장하지 못했어요. 잠시 후 다시 시도해 주세요.';
                    error.hidden = false;
                    saveBtn.disabled = false;
                });
            }).catch(function () {
                error.textContent = '저장하지 못했어요. 잠시 후 다시 시도해 주세요.';
                error.hidden = false;
                saveBtn.disabled = false;
            });
        });
    })();
</script>
</body>
</html>
