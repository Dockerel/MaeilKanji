<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/page :: head('구독 해지 완료')}"></head>
<body>
<nav th:replace="~{fragments/page :: nav}"></nav>

<main class="page-main">
    <div class="container px-4">
        <div class="text-center mb-5">
            <span class="status-icon success" aria-hidden="true">👋</span>
            <p class="section-label">Unsubscribed</p>
            <h1 class="section-title h2">이용해 주셔서 감사합니다</h1>
            <p class="text-muted-2 mt-2 mb-0">
                구독 해지가 정상적으로 처리되었습니다. <br class="d-none d-md-inline">
                언제든 돌아오실 수 있어요. 다음에 또 만나요!
            </p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="page-card">
                    <div class="page-card-body">
                        <p class="block-title">안내</p>
                        <ul class="check-list mb-0">
                            <li>앞으로 학습 메일이 발송되지 않습니다.</li>
                            <li>실수로 해지하셨다면 홈에서 언제든 다시 구독하실 수 있어요.</li>
                        </ul>
                    </div>

                    <!-- 선택: 해지 사유 피드백 -->
                    <div class="page-card-foot">
                        <p class="block-title mb-1">구독을 해지하신 이유를 알려주실 수 있을까요?</p>
                        <p class="small text-muted-2 mb-3">더 나은 매일 칸지를 만드는 데 큰 도움이 돼요. (선택)</p>
                        <form th:action="@{/feedback}" method="post">
                            <input type="hidden" name="memberId" th:value="${memberId}"/>
                            <div class="choice-grid two mb-3">
                                <label class="choice-card">
                                    <input type="radio" name="reason" value="frequency" checked>
                                    <span class="choice-title">메일이 너무 자주 와요</span>
                                </label>
                                <label class="choice-card">
                                    <input type="radio" name="reason" value="content">
                                    <span class="choice-title">콘텐츠가 기대와 달라요</span>
                                </label>
                                <label class="choice-card">
                                    <input type="radio" name="reason" value="difficulty">
                                    <span class="choice-title">난이도가 맞지 않아요</span>
                                </label>
                                <label class="choice-card">
                                    <input type="radio" name="reason" value="other">
                                    <span class="choice-title">기타</span>
                                </label>
                            </div>
                            <textarea name="comment" class="form-control mb-3" rows="3" maxlength="240"
                                      placeholder="자세한 의견을 적어주세요 (선택)"></textarea>
                            <div class="d-flex flex-column flex-sm-row gap-2 justify-content-end">
                                <a th:href="@{/}" class="btn btn-ghost">홈으로 돌아가기</a>
                                <button type="submit" class="btn btn-maeil">피드백 보내기</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/page :: footer}"></footer>
</body>
</html>
