<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매일 칸지 관리자 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/typography.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --maeil-blue: #2563EB;
            --maeil-light-blue: #F0F5FF;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif !important;
            background-color: var(--maeil-light-blue);
        }
        .text-maeil { color: var(--maeil-blue) !important; }
        .bg-maeil { background-color: var(--maeil-blue) !important; }
        .btn-maeil {
            background-color: var(--maeil-blue);
            border-color: var(--maeil-blue);
            color: white;
            transition: all 0.3s;
        }
        .btn-maeil:hover {
            background-color: #1E4DBC;
            border-color: #1E4DBC;
            color: white;
        }
        .login-card {
            max-width: 450px;
            margin-top: 10vh;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card login-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-flex justify-content-center align-items-center mb-2" style="gap: 8px;">
                        <a th:replace="~{fragments/brand :: brand}"></a>
                        <span class="badge rounded-pill text-bg-light border">Admin</span>
                    </div>
                    <p class="text-muted">관리자 인증을 위해 이메일을 입력해 주세요.</p>
                </div>

                <form id="adminLoginForm">
                    <div class="mb-3">
                        <label for="adminEmail" class="form-label small fw-bold">관리자 이메일</label>
                        <div class="input-group">
                            <input type="email" class="form-control" id="adminEmail" placeholder="admin@example.com" required>
                            <button class="btn btn-maeil btn-sm" type="button" id="sendAdminCodeBtn" onclick="sendAdminVerificationCode()">코드 발송</button>
                        </div>
                        <div id="emailHelp" class="form-text text-danger" style="display: none;"></div>
                    </div>

                    <div id="adminVerificationSection" style="display: none;">
                        <div class="mb-3">
                            <label for="adminCode" class="form-label small fw-bold">로그인 코드 (10자리)</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="adminCode" placeholder="메일로 받은 10자리 영문·숫자 입력" maxlength="10" autocomplete="one-time-code">
                                <button class="btn btn-maeil btn-sm" type="button" id="verifyAdminCodeBtn" onclick="verifyAdminCode()">로그인</button>
                            </div>
                            <div id="codeHelp" class="form-text text-danger" style="display: none;"></div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --------------------------------------------------------
    // TODO: 관리자 인증 로직을 위한 JavaScript (AJAX 연동)
    // --------------------------------------------------------

    // API 경로 (예시: /api/admin/send-code 와 같이 일반 회원가입과 분리 필요)
    const ADMIN_API_URL = '/api/v1/admin';

    // Helper: 성공/실패 메시지 UI 업데이트
    function updateHelpText(elementId, message, isSuccess) {
        const helpText = document.getElementById(elementId);
        helpText.textContent = message;
        helpText.classList.remove('text-danger', 'text-success');
        helpText.classList.add(isSuccess ? 'text-success' : 'text-danger');
        helpText.style.display = 'block';
    }

    // 1. 관리자 인증 코드 발송 요청
    async function sendAdminVerificationCode() {
        const emailInput = document.getElementById('adminEmail');
        const email = emailInput.value;
        const btn = document.getElementById('sendAdminCodeBtn');

        // (유효성 검사 생략)

        btn.textContent = '발송 중...';
        btn.disabled = true;

        try {
            const response = await fetch(`${ADMIN_API_URL}/send-login-code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });

            const helpTextId = 'emailHelp';

            if (response.ok) {
                // 성공 응답 (HTTP 200)
                updateHelpText(helpTextId, '✅ 인증 코드가 발송되었습니다. 3분 내로 입력하세요.', true);
                document.getElementById('adminVerificationSection').style.display = 'block';
                btn.textContent = '코드 재발송';
                btn.disabled = false;

            } else {
                // 실패 응답 (HTTP 4xx: 관리자 이메일이 아님, 5xx: 서버 오류)
                const errorMessage = response.status === 401
                    ? "관리자 이메일이 아닙니다."
                    : "인증 메일 발송에 실패했습니다. 잠시 후 다시 시도해 주세요.";
                updateHelpText(helpTextId, `❌ ${errorMessage}`, false);
                btn.textContent = '코드 발송';
                btn.disabled = false;
            }

        } catch (error) {
            updateHelpText('emailHelp', '❌ 서버 통신 오류가 발생했습니다.', false);
            btn.textContent = '코드 발송';
            btn.disabled = false;
        }
    }

    // 2. 인증 코드 확인 및 로그인 시도
    async function verifyAdminCode() {
        const email = document.getElementById('adminEmail').value;
        const code = document.getElementById('adminCode').value.trim();
        const btn = document.getElementById('verifyAdminCodeBtn');
        const helpTextId = 'codeHelp';

        if (code.length !== 10) {
            updateHelpText(helpTextId, '10자리 코드를 입력해 주세요.', false);
            return;
        }

        btn.textContent = '로그인 중...';
        btn.disabled = true;

        try {
            const response = await fetch(`${ADMIN_API_URL}/verify-login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, code: code })
            });

            // NOTE: 백엔드에서 인증 성공 시, 응답 헤더에 세션 쿠키(임시 토큰)를 포함하여 보내야 합니다.

            const data = response.ok ? await response.json() : null;

            if (data && data.success) {
                // 성공 응답 (HTTP 200, success=true)
                updateHelpText(helpTextId, '✅ 인증 성공! 관리자 페이지로 이동합니다.', true);

                // 페이지 이동 (토큰이 쿠키에 담겨 있으므로, 다음 페이지에서 Interceptor가 검사)
                window.location.href = '/admin/dashboard';

            } else {
                // 실패 응답 (success=false: 코드 불일치, 400: 만료, 429: 시도 횟수 초과)
                const errorMessage = response.status === 429
                    ? "시도 횟수를 초과했습니다. 코드를 다시 발송해 주세요."
                    : "코드가 일치하지 않거나 만료되었습니다.";
                updateHelpText(helpTextId, `❌ ${errorMessage}`, false);
                btn.textContent = '로그인';
                btn.disabled = false;
            }
        } catch (error) {
            updateHelpText(helpTextId, '❌ 서버 통신 오류가 발생했습니다.', false);
            btn.textContent = '로그인';
            btn.disabled = false;
        }
    }

</script>
</body>
</html>
